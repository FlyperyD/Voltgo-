ce.oninput=function(){var d=ce.value.replace(/\D/g,"").slice(0,4);ce.value=d.length>2?d.slice(0,2)+"/"+d.slice(2):d};$("skip").onclick=done;
go.onclick=function(){var n=cn.value.replace(/\D/g,""),m=ce.value.split("/"),e="";
if(!luhn(n))e="Перевірте номер картки";else if(!(m[0]>=1&&m[0]<=12&&m[1]&&m[1].length==2))e="Вкажіть термін дії у форматі ММ/РР";else if($("cv").value.length!=3)e="Введіть 3 цифри CVC";
if(e){$("er").textContent=e;return}
S.card={brand:n[0]=="4"?"Visa":(n[0]=="5"||n[0]=="2")?"Mastercard":"Картка",last4:n.slice(-4)};save();done()}}}
function luhn(n){if(n.length<13)return false;var s=0,a=false;for(var i=n.length-1;i>=0;i--){var d=+n[i];if(a){d*=2;if(d>9)d-=9}s+=d;a=!a}return s%10==0}
function done(){$("ob").classList.remove("on");refresh();show("map");if(tmp.rent){tmp.rent=false;if(S.card)scan()}}
function terms(){modal('<h2>Умови використання</h2><div class="stack" style="font-size:15px"><p>1. Сервіс «VOLTGO» надає павербанки в тимчасове користування через станції.</p><p>2. Оплата: перші 5 хвилин безкоштовно, далі 30 ₴ за годину, не більше 150 ₴ за добу. Застава не стягується.</p><p>3. Павербанк потрібно повернути в будь-яку станцію. Якщо його не повернуто протягом 7 днів, він вважається втраченим і з картки списується його вартість 800 ₴.</p><p>4. Ви відповідаєте за збереження павербанка й не передаєте його третім особам.</p><p>5. Ми обробляємо номер телефону та дані оренд лише для роботи сервісу.</p><p class="mu">Це шаблон для демо. Перед запуском текст має перевірити юрист.</p></div><button class="pri" style="margin-top:14px" id="cl">Закрити</button>');$("cl").onclick=close}

/* map */
function drawMap(){var h='<rect width="400" height="300" fill="var(--map)"/><ellipse cx="50" cy="270" rx="90" ry="55" fill="var(--pk)"/><path d="M0 235Q120 200 200 245T400 225" stroke="#9DB9F5" stroke-width="12" fill="none" opacity=".6"/><g stroke="var(--rd)" stroke-width="10" fill="none" stroke-linecap="round"><path d="M0 130H400"/><path d="M190 0V300"/><path d="M0 50L400 250"/><path d="M310 0V300" stroke-width="6"/></g>';
SOON.forEach(function(p){h+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="11" fill="none" stroke="var(--mu)" stroke-width="2" stroke-dasharray="4 3"/>'});
ST.forEach(function(s){var a=s.id==sel;h+='<g class="pin" tabindex="0" role="button" aria-label="'+s.n+', вільних: '+s.f+'" data-id="'+s.id+'"><circle class="pc" cx="'+s.x+'" cy="'+s.y+'" r="'+(a?24:19)+'" fill="'+(a?"#00F0FF":"#000")+'"/><text x="'+s.x+'" y="'+(s.y+6)+'" text-anchor="middle" font-size="17" font-weight="800" fill="#fff" font-family="Manrope,sans-serif">'+s.f+'</text></g>'});
$("svg").innerHTML=h;$("svg").querySelectorAll(".pin").forEach(function(p){p.onclick=function(){pick(+p.dataset.id)};p.onkeydown=function(e){if(e.key=="Enter"||e.key==" "){e.preventDefault();pick(+p.dataset.id)}}})}
function icon(s){return L.divIcon({className:"",html:'<div class="mk'+(s.id==sel?" on":"")+(s.f?"":" z")+'">'+s.f+'</div>',iconSize:[40,40],iconAnchor:[20,20]})}
var LAY={
scheme:function(d){return["https://{s}.basemaps.cartocdn.com/"+(d?"dark_all":"rastertiles/voyager")+"/{z}/{x}/{y}{r}.png",{subdomains:"abcd",maxZoom:19,attribution:"© OpenStreetMap, © CARTO"}]},
osm:function(){return["https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}]},
sat:function(){return["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Esri World Imagery"}]}};
function setLayer(n){if(!lm)return;layer=n;tfail=0;if(tl)lm.removeLayer(tl);var dk=matchMedia("(prefers-color-scheme:dark)").matches&&document.documentElement.dataset.theme!="light",a=LAY[n](dk);
tl=L.tileLayer(a[0],a[1]).addTo(lm);tl.on("tileerror",function(){if(++tfail<6)return;if(layer=="scheme")setLayer("osm");else if(layer=="osm"||layer=="sat"){lm.remove();lm=null;$("gmap").classList.add("hide");$("svg").classList.remove("hide");toast("Карта не завантажилась, показано схему")}})}
function setMe(ll){mePos=ll;if(lm){if(!me)me=L.circleMarker(ll,{radius:8,color:"#fff",weight:3,fillColor:"#2A8BFF",fillOpacity:1}).addTo(lm);else me.setLatLng(ll)}drawTiles()}
function nearest(){if(!mePos)return null;return ST.filter(function(s){return s.f>0}).sort(function(a,b){return dm(a)-dm(b)})[0]}
function dm(s){var R=6371e3,r=Math.PI/180,a=Math.sin((s.lat-mePos[0])*r/2),b=Math.sin((s.lng-mePos[1])*r/2);return 2*R*Math.asin(Math.sqrt(a*a+Math.cos(mePos[0]*r)*Math.cos(s.lat*r)*b*b))}
function locate(){if(!navigator.geolocation){toast("Геолокація недоступна");return}navigator.geolocation.getCurrentPosition(function(p){setMe([p.coords.latitude,p.coords.longitude]);var n=nearest();if(n){pick(n.id);if(lm)lm.fitBounds([mePos,[n.lat,n.lng]],{padding:[60,60],maxZoom:17});toast("Найближча станція: «"+n.n+"»")}},function(){toast("Дозвольте доступ до геолокації")},{enableHighAccuracy:true,timeout:10000})}
function initGoogle(){if(!window.L)return;$("svg").classList.add("hide");$("gmap").classList.remove("hide");
lm=L.map("gmap",{zoomControl:false}).setView([49.0475,24.364],14);setLayer("scheme");L.control.zoom({position:"bottomright"}).addTo(lm);
ST.forEach(function(s){lmk[s.id]=L.marker([s.lat,s.lng],{icon:icon(s)}).addTo(lm).on("click",function(){pick(s.id)});geocode(s)});
$("bLay").onclick=function(){setLayer(layer=="sat"?"scheme":"sat");$("bLay").textContent=layer=="sat"?"Схема":"Шар"};$("bLoc").onclick=locate;
if(navigator.geolocation)navigator.geolocation.watchPosition(function(p){setMe([p.coords.latitude,p.coords.longitude])},function(){})}
function geocode(s){if(location.protocol=="file:")return;fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+encodeURIComponent(s.q)).then(function(r){return r.json()}).then(function(j){if(j&&j[0]){s.lat=+j[0].lat;s.lng=+j[0].lon;if(lmk[s.id])lmk[s.id].setLatLng([s.lat,s.lng]);drawTiles()}}).catch(function(){})}
function dist(s){if(!mePos)return"";var R=6371e3,r=Math.PI/180,a=Math.sin((s.lat-mePos[0])*r/2),b=Math.sin((s.lng-mePos[1])*r/2),d=2*R*Math.asin(Math.sqrt(a*a+Math.cos(mePos[0]*r)*Math.cos(s.lat*r)*b*b));return", "+(d<1000?Math.round(d)+" м":(d/1000).toFixed(1)+" км")+", "+Math.ceil(d/80)+" хв пішки"}
function toast(t){var e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove("on")},6000)}
var lt;
function live(){clearTimeout(lt);var d=(120+Math.random()*480)*1000/(fast?60:1);lt=setTimeout(function(){var s=ST[Math.random()*ST.length|0],up=Math.random()<.5;
if(up&&s.f<s.t){s.f++;toast("На «"+s.n+"» з’явився павербанк")}else if(s.f>1){s.f--;toast("На «"+s.n+"» павербанк забрали")}
drawMap();drawTiles();live()},d)}
function drawTiles(){var L2=ST.filter(function(s){return!onlyFree||s.f>0});if(mePos)L2.sort(function(a,b){return dm(a)-dm(b)});var nn=nearest();
$("tot").textContent="Вільних: "+ST.reduce(function(a,s){return a+s.f},0);
$("tiles").innerHTML=L2.map(function(s){return'<button class="tile'+(s.f?"":" z")+'" aria-pressed="'+(s.id==sel)+'" data-id="'+s.id+'">'+(nn&&nn.id==s.id?'<span class="bd">Найближча</span>':'')+'<b>'+s.n+'</b><span class="n">'+s.f+'</span><span class="mu">вільних із '+s.t+dist(s)+'</span></button>'}).join("")||'<p class="mu">Станцій із павербанками зараз немає.</p>';
$("tiles").querySelectorAll(".tile").forEach(function(b){b.onclick=function(){pick(+b.dataset.id)}});
$("fAll").setAttribute("aria-pressed",!onlyFree);$("fFree").setAttribute("aria-pressed",onlyFree);
$("fAll").onclick=function(){onlyFree=false;drawTiles()};$("fFree").onclick=function(){onlyFree=true;drawTiles()};
var s=st(sel);$("gmlink").href="https://www.google.com/maps/dir/?api=1&destination="+s.lat+","+s.lng+"&travelmode=walking";$("gmlink").textContent="Маршрут до «"+s.n+"» у Google Maps";
$("rentHere").disabled=!!S.active||s.f==0;$("rentHere").textContent=S.active?"У вас уже є активна оренда":s.f?"Орендувати тут":"Тут немає павербанків";
if(lm)ST.forEach(function(x){lmk[x.id].setIcon(icon(x))})}
function pick(id){sel=id;drawMap();drawTiles();if(lm)lm.flyTo([st(id).lat,st(id).lng],Math.max(lm.getZoom(),16),{duration:.6})}
function refresh(){drawMap();drawTiles()}
$("rentHere").onclick=function(){if(!S.card){tmp.rent=true;ob("card");return}scan()};
function scan(){modal('<h2>Скануйте QR на станції</h2><div class="mu">'+st(sel).n+'</div><div class="scan"><i></i></div><div class="stack"><button class="pri" id="ds">Імітувати скан</button><button class="sec" id="cl">Скасувати</button></div>');
$("cl").onclick=close;$("ds").onclick=function(){var s=st(sel);if(s.f>0){s.f--;S.active={sid:sel,t0:Date.now()};save()}close();pick(sel);show("rent");startTick();toast("Осередок №"+(1+Math.random()*8|0)+" відкрито. Заберіть павербанк")}}

/* rent, history, profile */
function drawRent(){var a=S.active,b=$("v-rent");
if(!a){b.innerHTML='<h2>Активної оренди немає</h2><p class="mu">Оберіть станцію на карті та скануйте QR-код.</p><button class="pri" id="tm2">Знайти станцію</button>';$("tm2").onclick=function(){show("map")};return}
b.innerHTML='<div class="batt" aria-hidden="true"><div class="fill" id="fill"></div><div class="t" id="tm">0:00</div></div><div class="row"><span>Заряд павербанка</span><b id="pc">100%</b></div><div class="row"><span>До сплати зараз</span><b id="cs">0 ₴</b></div><div class="row"><span>Спише з картки</span><span>'+(S.card?S.card.brand+" •••• "+S.card.last4:"—")+'</span></div><label class="f" for="ret" style="margin-top:14px">Куди повернути</label><select id="ret" style="margin-bottom:14px">'+ST.map(function(s){return'<option value="'+s.id+'"'+(s.id==a.sid?" selected":"")+'>'+s.n+'</option>'}).join("")+'</select><div class="stack"><button class="pri" id="dr">Повернути павербанк</button><label class="chk mu"><input type="checkbox" id="fs"'+(fast?" checked":"")+'><span>Демо: пришвидшити час ×60</span></label></div>';
$("fs").onchange=function(){fast=this.checked;tickNow();live()};
$("dr").onclick=function(){var ms=el(),rs=st($("ret").value);rs.f++;S.hist.unshift({f:st(a.sid).n,t:rs.n,d:new Date().toLocaleString("uk-UA",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"}),du:fmt(ms),c:cost(ms/60000)});S.active=null;save();clearInterval(tick);pick(rs.id);show("hist");toast("Дякуємо! Оренду завершено")};tickNow()}
function el(){var e=Date.now()-S.active.t0;return fast?e*60:e}
function tickNow(){if(!S.active||!$("tm"))return;var ms=el();$("tm").textContent=fmt(ms);$("cs").textContent=cost(ms/60000)+" ₴";$("pc").textContent=Math.max(5,100-Math.round(ms/36e5*30))+"%";$("fill").style.width=Math.min(100,ms/36e5*100)+"%"}
function startTick(){clearInterval(tick);tick=setInterval(tickNow,1000)}
function drawHist(){$("v-hist").innerHTML=S.hist.length?S.hist.map(function(h){return'<div class="row"><span><b>'+h.d+'</b><br><span class="mu">'+h.f+' → '+h.t+', '+h.du+'</span></span><b>'+h.c+' ₴</b></div>'}).join(""):'<p class="mu">Тут з’являться ваші оренди після першого повернення.</p>'}
function drawMe(){var u=S.user||{},c=S.card;$("v-me").innerHTML='<div class="row"><span>Акаунт</span><b>'+(u.name||"—")+'</b></div><div class="row"><span>Умови прийнято</span><span>'+(S.terms?new Date(S.terms).toLocaleDateString("uk-UA"):"ні")+'</span></div><h2 style="margin-top:22px">Картка</h2>'+(c?'<div class="cc"><div style="opacity:.8">'+c.brand+'</div><div style="font-size:20px;font-weight:800;margin-top:24px">•••• •••• •••• '+c.last4+'</div></div>':'<p class="mu">Картку не додано. Вона потрібна для оренди.</p>')+'<label class="chk mu" style="margin-top:16px"><input type="checkbox" id="fs2"'+(fast?" checked":"")+'><span>Демо: пришвидшити час ×60 (повідомлення про павербанки раз на 2–10 хв)</span></label><div class="stack" style="margin-top:16px"><button class="pri" id="ac">'+(c?"Замінити картку":"Додати картку")+'</button><button class="sec" id="tr">Умови використання</button><button class="sec" id="lo">Вийти</button></div>';
$("fs2").onchange=function(){fast=this.checked;live()};$("ac").onclick=function(){ob("card")};$("tr").onclick=terms;$("lo").onclick=function(){if(S.active){modal('<h2>Спершу поверніть павербанк</h2><p class="mu">Активна оренда триває. Завершіть її, щоб вийти.</p><button class="pri" id="cl">Зрозуміло</button>');$("cl").onclick=close;return}S={user:null,card:null,terms:null,active:null,hist:[]};save();ob("welcome")}}
refresh();initGoogle();live();show("map");if(S.active)startTick();
if(!S.user)ob("welcome");else if(!S.terms)ob("terms");
</script>
</body>
</html>
